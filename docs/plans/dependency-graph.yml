  - requirements.txt        # dependency declarations
  - .gitignore              # root config baseline
  - tests/conftest.py       # every test concern adds fixtures (1.3, 1.6, 2.3)
  - docs/status.md          # declared shared; see note below
  #
  # NOTE on docs/status.md — declared here but deliberately ABSENT from every
  # story's files_touched. Two reasons: it is written by the dev workflow after
  # a story completes, not by the story's code change; and it carries
  # `merge=union` in .gitattributes, so concurrent appends can never conflict.
  # Listing it per-story would put a permanent false positive into the
  # same-wave overlap check, masking a genuine overlap later.
  #
  # NOTE on tests/conftest.py — created in wave 2 (story 1.3) rather than in a
