name: "Agentic Eval Pipeline"

# Generated for THIS project by AIRE v1.0.
# Commands come from the repo's own build files (requirements.txt - the only one
# present on main). Thresholds come from .evals/config.json and are never
# restated here. CI re-verifies the local gates; it never relaxes them.

on:
  pull_request:
    branches:
      - main
      - 'epic/**'
      - 'bug/**'
      - 'enh/**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.14"

jobs:
  verify-and-evaluate:
    name: "Verify and evaluate"
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - name: "Checkout with full history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Resolve EVAL_KEY and BASE_SHA"
        id: ctx
        shell: bash
        run: |
          # V11: EVAL_KEY is a work-unit slug, NEVER github.head_ref - a branch
          # ref contains '/' and would nest the evidence directory elsewhere.
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            KEY="pr-${{ github.event.pull_request.number }}"
            BASE_SHA="$(git merge-base origin/${{ github.base_ref }} HEAD)"
          else
            KEY="push-${GITHUB_SHA::12}"
            BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "eval_key=${KEY}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved EVAL_KEY=${KEY} BASE_SHA=${BASE_SHA}"

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Install runtime dependencies and verify"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # The repo's own manifest, ceilings included - never bypassed.
          pip install -r requirements.txt
          python -c "import numpy, cv2, sklearn; print('numpy', numpy.__version__, 'cv2', cv2.__version__)"

      - name: "Install eval tooling and verify"
        shell: bash
        run: |
          # V16: every install is followed by a version check in the SAME block.
          pip install ruff mypy semgrep pip-audit detect-secrets pip-licenses pytest pytest-cov
          ruff --version
          mypy --version
          semgrep --version
          pip-audit --version
          detect-secrets --version
          pip-licenses --version
          pytest --version

      # ---------------- Stage 1: deterministic gates D1-D7 ----------------
      - name: "Stage 1: deterministic gates D1-D7"
        id: static
        continue-on-error: true
        env:
          EVAL_KEY: ${{ steps.ctx.outputs.eval_key }}
        shell: bash
        run: bash .evals/scripts/run-static-evals.sh "${{ steps.ctx.outputs.base_sha }}"

      # ---------------- Stage 2: behavioural ----------------
      - name: "Stage 2: unit tests and coverage"
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          MIN="$(python -c "import json;print(json.load(open('.evals/config.json'))['thresholds']['unitTestCoverageMin'])")"
          if [ -d tests ]; then
            pytest tests --cov=eye_tracker --cov=main --cov-report=xml --cov-report=term-missing --cov-fail-under="${MIN}"
          else
            echo "ERROR: no tests/ directory - the coverage gate cannot be measured."
            echo "This is an ERROR, not N/A: the gate should have run."
            exit 1
          fi

      - name: "Stage 2: Gherkin behaviour tiers"
        id: behaviour
        continue-on-error: true
        shell: bash
        run: |
          if ! command -v podman >/dev/null 2>&1 && ! command -v docker >/dev/null 2>&1; then
            echo "ERROR: no container runtime for the behaviour tiers."
            echo "Recorded as ERROR, never N/A - the gate should have run."
            exit 1
          fi
          bash .evals/behavior/run.sh b1

      # ---------------- Stage 3: semantic judges J1/J2 ----------------
      - name: "Stage 3: judge gates J1 and J2"
        id: judges
        continue-on-error: true
        env:
          EVAL_KEY: ${{ steps.ctx.outputs.eval_key }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "ERROR: CLAUDE_CODE_OAUTH_TOKEN is not set. The judge gate should"
            echo "have run. Missing credentials is an ERROR, never N/A."
            exit 1
          fi
          npm install -g @anthropic-ai/claude-code
          claude --version
          bash .evals/scripts/run-evals.sh "${{ steps.ctx.outputs.base_sha }}"

      # ---------------- SonarQube: LAST gate step, additive ----------------
      - name: "SonarQube scan"
        id: sonar
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ENABLED="$(python -c "import json;print(json.load(open('.evals/config.json'))['sonarqube']['enabled'])")"
          if [ "${ENABLED}" != "True" ]; then
            echo "SonarQube not enabled in .evals/config.json - skipping."
            exit 0
          fi
          if [ -z "${{ secrets.SONAR_TOKEN }}" ] || [ -z "${{ vars.SONAR_HOST_URL }}" ]; then
            echo "ERROR: sonarqube.enabled is true but SONAR_TOKEN / SONAR_HOST_URL are absent."
            exit 1
          fi
          npx --yes sonarqube-scanner \
            -Dsonar.host.url="${{ vars.SONAR_HOST_URL }}" \
            -Dsonar.token="${{ secrets.SONAR_TOKEN }}"

      # ---------------- Verdict: the ONLY step that fails the job ----------------
      - name: "Verdict"
        id: verdict
        shell: bash
        run: |
          # 4.0c: tally every gate outcome. No `|| true` anywhere above; each
          # gate step carries id + continue-on-error so one failure never skips
          # the others, and this step alone decides the job result.
          FAILED=""
          add() { if [ "$2" != "success" ]; then FAILED="${FAILED} $1"; fi; }
          add "Stage1-static"    "${{ steps.static.outcome }}"
          add "Stage2-unit"      "${{ steps.unit.outcome }}"
          add "Stage2-behaviour" "${{ steps.behaviour.outcome }}"
          add "Stage3-judges"    "${{ steps.judges.outcome }}"
          add "SonarQube"        "${{ steps.sonar.outcome }}"
          KEY="${{ steps.ctx.outputs.eval_key }}"
          EVDIR=".spec/aire-docs/implementation/code/eval-evidence/${KEY}"
          mkdir -p .evals/_run
          if [ -n "${FAILED}" ]; then
            echo "verdict=FAIL" >> "$GITHUB_OUTPUT"
            echo "FAILING GATES:${FAILED}"
            # 4.0c.3: every failing gate must reach failed-gates.txt so
            # self-repair has something to act on.
            for g in ${FAILED}; do echo "$g" >> .evals/_run/failed-gates.txt; done
            [ -f "${EVDIR}/eval-summary.md" ] && cat "${EVDIR}/eval-summary.md" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          echo "All gates passed."
          [ -f "${EVDIR}/eval-summary.md" ] && cat "${EVDIR}/eval-summary.md" >> "$GITHUB_STEP_SUMMARY"

      # ---------------- Stage 4: scorecard ----------------
      - name: "Stage 4: upload eval artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-evidence-${{ steps.ctx.outputs.eval_key }}
          path: |
            .spec/aire-docs/implementation/code/eval-evidence/${{ steps.ctx.outputs.eval_key }}/
            .evals/_run/failed-gates.txt
          if-no-files-found: warn

  self-repair:
    name: "Self-repair"
    needs: verify-and-evaluate
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "Checkout the head branch"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Resolve EVAL_KEY and BASE_SHA"
        id: ctx
        shell: bash
        run: |
          echo "eval_key=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git merge-base origin/${{ github.base_ref }} HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Download eval evidence"
        uses: actions/download-artifact@v4
        with:
          name: eval-evidence-pr-${{ github.event.pull_request.number }}
          path: .

      - name: "Install tooling"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy semgrep pip-audit detect-secrets pip-licenses pytest pytest-cov
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: "Repair, re-verify, commit"
        env:
          EVAL_KEY: ${{ steps.ctx.outputs.eval_key }}
          BASE_REF: ${{ steps.ctx.outputs.base_sha }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        shell: bash
        run: |
          git config user.name "aire-self-repair[bot]"
          git config user.email "aire-self-repair@users.noreply.github.com"
          bash .evals/scripts/auto-fix-agent.sh "${BASE_REF}"

      - name: "Push the repair"
        shell: bash
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
